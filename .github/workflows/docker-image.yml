# Monta a imagem Docker no GitHub (grátis) e publica no GHCR.
# O servidor e2-micro (1 GB) só faz pull, sem compilar nada.
name: docker-image
on:
  push:
    branches: [deploy]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/clubedamateria/openreply:deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max
